# Provisional full-PWM speed: not measured. navigation.launch.py overrides
# longitudinal limits from MAX_WHEEL_MPS, including custom params_file.
# ROS 2 Humble Nav2 설정.
#
# 현재 단계:
# - 저장 지도 + AMCL 사용
# - 고정된 임시 odom -> base_link TF 사용
# - 경로 계획 및 Nav2 노드 기동 검증
# - 실제 모터 출력 없음
#
# 실제 엔코더 odometry 연결 후 속도, footprint, 가속도 값을
# 실측값에 맞게 다시 조정해야 한다.

controller_server:
  ros__parameters:
    use_sim_time: false

    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_angle: 0.15
      required_movement_radius: 0.10
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.12

    FollowPath:
      # SegmentedRPP, not RotationShim, collision-checks final goal yaw.
      # Disable initial heading shimming to prevent unintended 180-degree
      # turns at the start of a reverse segment.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "patrol_navigation_controller::SegmentedRPPController"
      angular_dist_threshold: 3.15
      angular_disengage_threshold: 3.15
      forward_sampling_distance: 0.20
      rotate_to_heading_angular_vel: 1.05
      max_angular_accel: 1.00
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      segment_pivot_max_angular: 1.05
      segment_pivot_acceleration: 1.00
      segment_pivot_yaw_tolerance: 0.10
      segment_transfer_position_tolerance: 0.08
      closed_loop: true

      desired_linear_vel: 0.212
      lookahead_dist: 0.35
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.50
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.40
      regulated_linear_scaling_min_speed: 0.03
      inflation_cost_scaling_factor: 3.0
      cost_scaling_dist: 0.30
      cost_scaling_gain: 1.0
      transform_tolerance: 0.5
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.45
      use_rotate_to_heading: false
      allow_reversing: true
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 10.0
      publish_frequency: 2.0

      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05

      # Approved lower chassis envelope: length 280 mm, width 210 mm.
      # Wheels and protrusions are not included in this simplified footprint.
      footprint: "[[0.14, 0.105], [0.14, -0.105], [-0.14, -0.105], [-0.14, 0.105]]"
      footprint_padding: 0.03

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          inf_is_valid: false

          max_obstacle_height: 2.0
          obstacle_min_range: 0.10
          obstacle_max_range: 2.50
          raytrace_min_range: 0.10
          raytrace_max_range: 3.00

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 3.0

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: map
      robot_base_frame: base_link

      update_frequency: 10.0
      publish_frequency: 2.0
      resolution: 0.05

      footprint: "[[0.14, 0.105], [0.14, -0.105], [-0.14, -0.105], [-0.14, 0.105]]"
      footprint_padding: 0.03
      track_unknown_space: true

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          inf_is_valid: false
          # Keep dynamic obstacles across brief scan loss without tying
          # their persistence to the global costmap update frequency.
          # Local costmap remains immediately responsive to obstacles.
          observation_persistence: 0.5

          max_obstacle_height: 2.0
          obstacle_min_range: 0.10
          obstacle_max_range: 2.50
          raytrace_min_range: 0.10
          raytrace_max_range: 3.00

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 3.0

      always_send_full_costmap: true


planner_server:
  ros__parameters:
    use_sim_time: false

    expected_planner_frequency: 0.25
    planner_plugins: ["GridBased"]

    GridBased:
      # Select among collision-checked 32-heading Smac lattice routes by
      # expected execution time, not only geometric path/A* edge cost.
      plugin: "patrol_navigation_controller::TimeScoredLatticePlanner"
      candidate_names: ["QuickMotion", "StableTurns"]
      max_wheel_mps: 0.212
      max_angular_rps: 1.05
      wheel_track_m: 0.21  # overwritten from calibrated WHEEL_TRACK_M at launch
      max_linear_accel: 0.50
      max_angular_accel: 1.0
      max_linear_jerk: 2.0
      reverse_fraction: 1.00  # Same nominal speed as forward; rear blind guard remains independent
      switch_stop_sec: 0.50
      max_total_planning_time: 5.0

      # FastMotion permits low-cost reverse and pivot candidates.
      QuickMotion:
        tolerance: 0.50
        # Do not plan through unknown cells: the swept-footprint safety gate rejects them.
        allow_unknown: false
        max_iterations: 1000000
        max_planning_time: 1.8
        lattice_filepath: ""
        allow_reverse_expansion: true
        reverse_penalty: 1.0
        change_penalty: 0.0
        non_straight_penalty: 1.0
        cost_penalty: 2.0
        rotation_penalty: 1.0
        retrospective_penalty: 0.0
        smooth_path: false

      # Prefer fewer direction changes/turns to expose a second candidate
      # through the exact same live Costmap and motion primitives.
      StableTurns:
        tolerance: 0.50
        # Same verified-free-space contract as QuickMotion and the final sweep.
        allow_unknown: false
        max_iterations: 1000000
        max_planning_time: 1.8
        lattice_filepath: ""
        allow_reverse_expansion: true
        reverse_penalty: 1.8
        change_penalty: 0.20
        non_straight_penalty: 1.25
        cost_penalty: 2.0
        rotation_penalty: 2.0
        retrospective_penalty: 0.0
        smooth_path: false

smoother_server:
  ros__parameters:
    use_sim_time: false

    smoother_plugins:
      - simple_smoother

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true


behavior_server:
  ros__parameters:
    use_sim_time: false

    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint

    cycle_frequency: 10.0
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5

    simulate_ahead_time: 2.0
    max_rotational_vel: 1.05
    min_rotational_vel: 0.20
    rotational_acc_lim: 1.00

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"


bt_navigator:
  ros__parameters:
    use_sim_time: false

    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

    # Humble 기본 NavigateToPose Behavior Tree가 사용하는 plugin들
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node


bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false


bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false


waypoint_follower:
  ros__parameters:
    use_sim_time: false

    loop_rate: 10
    stop_on_failure: false

    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200


velocity_smoother:
  ros__parameters:
    use_sim_time: false

    smoothing_frequency: 10.0
    scale_velocities: false

    # 엔코더 /odom이 없으므로 현재는 OPEN_LOOP
    feedback: "OPEN_LOOP"

    max_velocity: [0.212, 0.0, 1.05]
    min_velocity: [-0.212, 0.0, -1.05]

    max_accel: [0.50, 0.0, 1.00]
    max_decel: [-0.50, 0.0, -1.00]

    odom_topic: /odom
    odom_duration: 0.1

    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0