<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | AI 순찰 관제 센터</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@0,400;0,700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=20260814-login">
    <link rel="stylesheet" href="/static/login_auth.css?v=20260814-email-auth">
    <link rel="stylesheet" href="/static/selected_ui.css?v=20261014-map-expand-v4">
    <link rel="stylesheet" href="/static/elastic_scroll.css?v=20261014-return-animation-v4">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-panel" aria-labelledby="login-title">
            <div class="login-brand">
                <span class="login-brand-kicker">AI Patrol Control</span>
                <h1 id="login-title">AI 자율순찰 로봇 관제 센터</h1>
            </div>

            <form class="login-form" id="loginForm" novalidate>
                <label class="auth-field" for="loginId">
                    <span>이메일</span>
                    <input id="loginId" type="email" autocomplete="username" maxlength="100" placeholder="이메일을 입력하세요" required>
                </label>
                <label class="auth-field" for="loginPassword">
                    <span>비밀번호</span>
                    <input id="loginPassword" type="password" autocomplete="current-password" maxlength="20" placeholder="비밀번호를 입력하세요" required>
                </label>
                <p class="auth-login-message" id="loginMessage" role="status" aria-live="polite"></p>
                <div class="auth-actions">
                    <button class="auth-btn secondary" type="button" id="openSignupBtn">회원가입</button>
                    <button class="auth-btn primary" type="submit" id="loginSubmit">로그인</button>
                </div>
            </form>
        </section>
    </main>

    <div class="signup-modal" id="signupModal" aria-hidden="true">
        <div class="signup-modal-backdrop" data-close-signup></div>
        <section class="signup-dialog" role="dialog" aria-modal="true" aria-labelledby="signup-title">
            <div class="signup-header">
                <h2 id="signup-title">회원가입</h2>
                <button class="signup-close" type="button" id="closeSignupBtn" aria-label="회원가입 닫기">&times;</button>
            </div>

            <form class="signup-form" id="signupForm" novalidate>
                <div class="auth-inline-action signup-email-row">
                    <label class="auth-field" for="signupEmail">
                        <span>이메일</span>
                        <input id="signupEmail" type="email" autocomplete="email" maxlength="100" required>
                    </label>
                    <button class="email-send-btn" type="button" id="sendEmailBtn">인증번호 발송</button>
                </div>

                <div class="auth-verify-row signup-verification-row" id="verifyRow" hidden>
                    <div class="auth-inline-action">
                        <label class="auth-field" for="verificationCode">
                            <span>인증번호</span>
                            <input id="verificationCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6">
                        </label>
                        <button class="email-send-btn" type="button" id="verifyEmailBtn">인증 확인</button>
                    </div>
                </div>

                <p class="auth-signup-message signup-feedback" id="signupMessage" role="status" aria-live="polite"></p>
                <fieldset class="auth-protected-fields" id="protectedFields">
                    <div class="auth-verified-email signup-verified" id="verifiedEmailLabel" hidden></div>
                    <label class="auth-field signup-field-password" for="signupPassword">
                        <span>비밀번호</span>
                        <input id="signupPassword" type="password" autocomplete="new-password" maxlength="20" required>
                        <small class="auth-field-hint">6~20자 영문, 숫자, ! @ # $ 사용 가능</small>
                    </label>
                    <label class="auth-field signup-field-confirm" for="signupPasswordConfirm">
                        <span>비밀번호 2차 확인</span>
                        <input id="signupPasswordConfirm" type="password" autocomplete="new-password" maxlength="20" required>
                        <small class="auth-field-hint" id="passwordHint"></small>
                    </label>
                    <label class="auth-field signup-field-name" for="signupName">
                        <span>이름</span>
                        <input id="signupName" autocomplete="name" maxlength="20" required>
                    </label>
                    <label class="auth-field signup-field-phone" for="signupPhone">
                        <span>전화번호</span>
                        <input id="signupPhone" type="tel" autocomplete="tel" maxlength="20" placeholder="010-1234-5678" required>
                    </label>
                    <label class="auth-field signup-field-employee" for="employeeNumber">
                        <span>사번</span>
                        <input id="employeeNumber" inputmode="numeric" maxlength="10" required>
                        <small class="auth-field-hint" id="employeeHint"></small>
                    </label>
                    <button class="auth-btn primary signup-submit" type="submit" id="signupSubmit" disabled>가입하기</button>
                </fieldset>
            </form>
        </section>
    </div>

    <script src="/static/login_email_auth.js?v=20261014-signup-input-v1"></script>
    <script src="/static/elastic_scroll.js?v=20261014-return-animation-v4"></script>
</body>
</html>
