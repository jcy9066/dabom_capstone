name: PR97 software validation
on:
  push:
    branches:
      - fix/pr96-integrated-stabilization-20261029
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install software-only test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi==0.136.1 httpx2==2.13.1 python-dotenv requests numpy==1.26.4 pyserial websockets==12.0 jinja2 itsdangerous bcrypt pymysql scipy==1.11.4 pyyaml==6.0.2 opencv-contrib-python-headless==4.8.1.78 pillow python-multipart==0.0.27
          python -m pip install torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Python syntax
        run: |
          python -m compileall -q server raspberry navigation/ros/patrol_navigation tests
      - name: Shell syntax
        run: |
          bash -n start_gpu_server.sh start_pi_stack.sh
      - name: JavaScript syntax
        run: |
          node --check frontend/services/static/script.js
          node --check frontend/services/static/navigation_control.js
          node --check frontend/services/static/recorded_loop_ui.js
          node --check frontend/components/navigation/saved_map_modal.js
          node --input-type=module --check < frontend/services/static/lidar_3d_viewer.js
      - name: JavaScript contracts
        run: |
          for test in tests/js/test_mapping_scan_time_pairing.js tests/js/test_mapping_ws_recovery.js tests/js/test_initial_pose_ui_contract.js tests/js/test_manual_loop_ui_contract.js; do node "$test"; done
      - name: Relevant Python regression
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: .
        run: |
          python -m pytest -q             tests/test_mapping_health.py tests/test_map_storage_integrity.py             tests/test_live_mapping_grid.py tests/test_navigation_mapping_recovery.py             tests/test_initial_pose_safety.py tests/test_initial_pose_map_validation.py             tests/test_localization_observation.py tests/test_localization_rotation.py             tests/test_localization_rotation_controller.py             tests/test_amcl_pose_stability_contract.py tests/test_navigation_control_api.py             tests/test_loop_session_api.py tests/test_loop_deadline_regression.py             tests/test_manual_loop_segments.py tests/test_manual_loop_pi_pulse.py             --tb=short
      - name: Full Python software regression
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: .
        run: |
          set +e
          python -m pytest -q tests --tb=no > /tmp/pr97-tests.txt 2>&1
          code=$?
          grep '^FAILED tests/' /tmp/pr97-tests.txt || true
          grep -E '[0-9]+ (failed|passed),.* in [0-9]' /tmp/pr97-tests.txt | tail -1 || true
          exit "$code"
      - name: Checkout PR96 baseline without modifying it
        if: always()
        uses: actions/checkout@v4
        with:
          ref: 005cbebc42bdc846aeb3978d685e9922cad74621
          path: original-pr96
      - name: Compare original PR96 failures to PR97
        if: always()
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          (cd original-pr96 && PYTHONPATH=. python -m pytest -q tests --tb=no > /tmp/pr96-tests.txt 2>&1) || true
          python - <<'PY'
          from pathlib import Path
          def failures(path):
              lines = Path(path).read_text(errors='replace').splitlines()
              ids = {line.split(' ', 2)[1] for line in lines
                     if line.startswith('FAILED tests/')}
              summary = next((line for line in reversed(lines)
                              if ' failed,' in line and ' passed,' in line),
                             'No complete pytest summary')
              return ids, summary
          before, old_summary = failures('/tmp/pr96-tests.txt')
          after, new_summary = failures('/tmp/pr97-tests.txt')
          print('PR96 original:', old_summary)
          print('PR97 current:', new_summary)
          print('New failing tests:', len(after - before))
          for name in sorted(after - before):
              print('NEW FAIL:', name)
          print('Resolved historical failures:', len(before - after))
          for name in sorted(before - after):
              print('FIXED:', name)
          PY
